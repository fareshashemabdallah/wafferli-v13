name: Export Dabberna source code to Word

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/export_source_word.py'
      - '.github/workflows/export-source-word.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-word:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Word document library
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Generate complete Word source document
        run: python .github/scripts/export_source_word.py
      - name: Verify generated document
        run: |
          test -s Dabberna_Complete_Source_Code.docx
          python - <<'PY'
          from docx import Document
          d=Document("Dabberna_Complete_Source_Code.docx")
          headings=[p for p in d.paragraphs if p.style.name=="Heading 2" and "   " in p.text]
          assert len(headings)>100, f"Expected the complete project, got {len(headings)} file headings"
          print(f"Document contains {len(headings)} source file sections")
          PY
      - name: Attach source code Word document
        uses: actions/upload-artifact@v4
        with:
          name: dabberna-complete-source-word
          path: Dabberna_Complete_Source_Code.docx
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly downloadable Word file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "dabberna-source-word-20261015"             "Dabberna_Complete_Source_Code.docx"             --title "Dabberna Complete Source Code (Word) — 15 October 2026"             --notes "Searchable Microsoft Word export of all tracked text files in commit ${GITHUB_SHA}. Binary assets excluded. Use the repository for executable source."             --target "${GITHUB_SHA}" --latest=false
