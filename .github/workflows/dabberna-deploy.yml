name: Deploy Dabberna Full App
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/dabberna-deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dabberna-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: app
        run: bun install
      - name: Validate full app
        working-directory: app
        run: bun run typecheck
      - name: Test family finances, calendar and occasion planning
        working-directory: app
        run: bunx vitest run src/lib/cashflow.test.ts src/lib/arabic.test.ts src/lib/familyCalendar.test.ts src/lib/occasionAdvisor.test.ts
      - name: Refresh public occasion articles (anonymous category queries only)
        run: python3 app/scripts/occasion_trends.py
      - name: Build static React app
        working-directory: app
        env:
          VITE_ENABLE_LIVE_AI: ${{ vars.DABBERNA_ENABLE_LIVE_AI || 'false' }}
        run: bun run build
      - name: Verify compiled Dabberna entry page
        run: |
          test -s react-dist/index.html
          test -s react-dist/landing-family-characters.avif
          test -s react-dist/404.html
          test -s react-dist/explore/weekend/index.html
          grep -Fq '/wafferli-v13/#/explore/weekend' react-dist/explore/weekend/index.html
          grep -qi 'Dabberna' react-dist/index.html
      - name: Stamp release revision and reject obsolete amount toggles
        run: |
          printf '%s\n' "$GITHUB_SHA" > react-dist/build-revision.txt
          if grep -RlE 'Hide private amounts|Reveal amounts|Show private amounts' react-dist/assets; then
            echo "::error::Production assets still contain an old hide/reveal amounts control."
            exit 1
          fi
      - name: Build isolated redesign preview (optional)
        id: preview_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: design/clean-slate-single-category-2026-10-21
          path: redesign-preview
          persist-credentials: false
      - name: Install preview dependencies
        id: preview_install
        if: steps.preview_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: redesign-preview/app
        run: bun install --frozen-lockfile
      - name: Verify preview TypeScript
        id: preview_types
        if: steps.preview_install.outcome == 'success'
        continue-on-error: true
        working-directory: redesign-preview/app
        run: bun run typecheck
      - name: Verify preview regression tests
        id: preview_tests
        if: steps.preview_types.outcome == 'success'
        continue-on-error: true
        working-directory: redesign-preview/app
        run: bun run test
      - name: Build redesign under isolated /preview/ path
        id: preview_build
        if: steps.preview_tests.outcome == 'success'
        continue-on-error: true
        working-directory: redesign-preview/app
        env:
          VITE_ENABLE_LIVE_AI: "false"
        run: bunx vite build --base=/wafferli-v13/preview/
      - name: Assemble production and optional preview pages
        run: |
          if test -s redesign-preview/react-dist/index.html && grep -Fq '/wafferli-v13/preview/assets/' redesign-preview/react-dist/index.html; then
            mkdir -p react-dist/preview
            cp -a redesign-preview/react-dist/. react-dist/preview/
            rm -f react-dist/preview/offline-sw.js
          else
            echo "Optional redesign preview unavailable; publishing current main app without blocking."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: react-dist
      - id: deployment
        uses: actions/deploy-pages@v4
