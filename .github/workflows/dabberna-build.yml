name: Validate Dabberna family app
on:
  push:
    branches: [main, family-first-dashboard-oct-2026]
    paths:
      - 'app/**'
      - '.github/workflows/dabberna-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/dabberna-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: TypeScript check
        working-directory: app
        run: bun run typecheck
      - name: Unit tests
        working-directory: app
        run: bun run test
      - name: Build React application
        working-directory: app
        run: bun run build
      - name: Verify compiled entry page
        run: |
          test -s react-dist/index.html
          grep -qi "Dabberna" react-dist/index.html
      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: dabberna-validated-site
          path: react-dist/
          if-no-files-found: error
